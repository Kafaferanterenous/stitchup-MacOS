[package]
name = "stitchup-core"
version = "0.1.0"
edition = "2021"
description = "Stitchup structural core: open/save, page ops, source-hash & atomic-save integrity (D-05 lopdf backend)"
license = "MIT OR Apache-2.0"

[dependencies]
lopdf = "0.44"
sha2 = { version = "0.10", features = ["oid"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
# Digital signatures (pure Rust, RustCrypto): RSA key, self-signed X.509, CMS/PKCS#7.
rsa = { version = "0.9", features = ["sha2"] }
x509-cert = { version = "0.2", features = ["builder"] }
cms = { version = "0.2", features = ["builder"] }
der = { version = "0.7", features = ["alloc", "oid"] }
spki = "0.7"
const-oid = { version = "0.9", features = ["db"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Installed (system) fonts: read metrics, subset and embed (MIT / Apache-2.0).
ttf-parser = "0.25"
subsetter = "0.2"

[[bin]]
name = "generate_fixtures"
path = "src/bin/generate_fixtures.rs"

[[bin]]
name = "verify_fixtures"
path = "src/bin/verify_fixtures.rs"